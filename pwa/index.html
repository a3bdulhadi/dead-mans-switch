<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead Man's Switch</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>Dead Man's Switch</h1>
    <p id="status">Loading...</p>
    <div id="stageBadge" class="stage-badge stage-unknown">STAGE: NOT CONNECTED</div>

    <section class="card">
      <h2>1. Encrypt Evidence</h2>
      <label for="fileInput" class="label">Select evidence file</label>
      <input type="file" id="fileInput" />
      <button id="encryptBtn" type="button">Encrypt &amp; Download</button>

      <div id="resultBox" class="result hidden">
        <p class="result-label">Encrypted File keccak256 Hash</p>
        <code id="hashOutput"></code>

        <p class="result-label">One-Time AES Key (Base64 — for testing)</p>
        <code id="keyOutput"></code>
      </div>
    </section>

    <section class="card">
      <h2>2. Decrypt Evidence (M1 Demo)</h2>
      <label for="decryptFileInput" class="label">Select .enc file</label>
      <input type="file" id="decryptFileInput" />

      <label for="decryptKeyInput" class="label">AES Key (Base64)</label>
      <input type="text" id="decryptKeyInput" placeholder="Paste Base64 key..." />

      <label for="expectedHashInput" class="label">Expected keccak256 Hash (optional)</label>
      <input type="text" id="expectedHashInput" placeholder="0x... (leave blank to skip)" />

      <button id="decryptBtn" type="button" class="secondary">Verify &amp; Decrypt</button>
    </section>

    <section class="card">
      <h2>3. Signed Check-In (Day 9)</h2>
      <label for="rpcInput" class="label">Local Chain RPC URL</label>
      <input type="text" id="rpcInput" value="http://127.0.0.1:8545" />

      <label for="contractInput" class="label">Deployed Contract Address</label>
      <input type="text" id="contractInput" placeholder="0x..." />

      <button id="genKeyBtn" type="button">Generate / Load Signing Key</button>
      <button id="refreshStageBtn" type="button">Refresh Stage</button>
      <button id="sendCheckInBtn" type="button" class="secondary">Sign &amp; Send Check-In</button>

      <div id="checkInBox" class="result hidden">
        <p class="result-label">Signer Address</p>
        <code id="signerAddressOutput"></code>

        <p class="result-label">Check-In &amp; Transaction</p>
        <code id="sigOutput"></code>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="./crypto.js"></script>
  <script src="./checkin.js"></script>
  <script src="./chain.js"></script>
  <script src="./app.js"></script>
</body>
</html>
