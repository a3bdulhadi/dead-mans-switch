<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead Man's Switch</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>Dead Man's Switch</h1>
    <p id="status">Loading...</p>

    <section class="card">
      <label for="fileInput" class="label">Select evidence file</label>
      <input type="file" id="fileInput" />
      <button id="encryptBtn" type="button">Encrypt &amp; Download</button>

      <div id="resultBox" class="result hidden">
        <p class="result-label">Encrypted File keccak256 Hash</p>
        <code id="hashOutput"></code>

        <p class="result-label">One-Time AES Key (Base64 — for testing)</p>
        <code id="keyOutput"></code>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="./crypto.js"></script>
  <script src="./app.js"></script>
</body>
</html>
