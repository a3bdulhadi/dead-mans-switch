<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trustee Vouch — Dead Man's Switch</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>Trustee Vouch</h1>
    <p id="vouchStatus">Ready (1 vouch allowed per check-in period)</p>

    <section class="card">
      <label for="vouchRpc" class="label">Local Chain RPC URL</label>
      <input type="text" id="vouchRpc" value="http://127.0.0.1:8545" />

      <label for="vouchContract" class="label">Contract Address</label>
      <input type="text" id="vouchContract" placeholder="0x..." />

      <label for="trusteeName" class="label">Trustee Name / Note</label>
      <input type="text" id="trusteeName" placeholder="e.g. Trusted Contact #1" />

      <button id="vouchBtn" type="button" class="hero-btn">Submit Trustee Vouch</button>

      <div id="vouchBox" class="result hidden">
        <p class="result-label">Vouch Record</p>
        <code id="vouchOutput"></code>
      </div>

      <a href="./index.html" style="color:#38bdf8; font-size:0.85rem; text-align:center; margin-top:0.5rem;">Back to Main App</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script>
    const VOUCH_KEY = "dms_last_vouch_ts_v1";
    const PERIOD_MS = 2 * 24 * 60 * 60 * 1000; // 1 vouch per 2-day check-in period
    const VOUCH_ABI = ["function trusteeVouch() external"];

    const vouchStatus = document.getElementById("vouchStatus");
    const vouchRpc = document.getElementById("vouchRpc");
    const vouchContract = document.getElementById("vouchContract");
    const trusteeName = document.getElementById("trusteeName");
    const vouchBtn = document.getElementById("vouchBtn");
    const vouchBox = document.getElementById("vouchBox");
    const vouchOutput = document.getElementById("vouchOutput");

    vouchRpc.value = localStorage.getItem("dms_rpc_url_v1") || "http://127.0.0.1:8545";
    vouchContract.value = localStorage.getItem("dms_contract_addr_v1") || "";

    vouchBtn.addEventListener("click", async () => {
      const lastTs = Number(localStorage.getItem(VOUCH_KEY) || "0");
      if (lastTs && Date.now() - lastTs < PERIOD_MS) {
        vouchStatus.textContent = "Already vouched in this period (1 per period max)";
        return;
      }

      const name = trusteeName.value.trim() || "Trusted Contact";
      const rpcUrl = vouchRpc.value.trim();
      const addr = vouchContract.value.trim();

      vouchBtn.disabled = true;
      vouchBox.classList.remove("hidden");

      try {
        let chainNote = "Recorded locally (contract trusteeVouch() not deployed yet)";
        if (rpcUrl && addr) {
          try {
            const provider = new ethers.JsonRpcProvider(rpcUrl);
            const signer = await provider.getSigner(1);
            const contract = new ethers.Contract(addr, VOUCH_ABI, signer);
            const tx = await contract.trusteeVouch();
            const receipt = await tx.wait();
            chainNote = `Confirmed on-chain (Tx: ${receipt.hash})`;
          } catch (_) {}
        }

        localStorage.setItem(VOUCH_KEY, String(Date.now()));
        vouchOutput.textContent = `Trustee: ${name}\nTime: ${new Date().toLocaleString()}\n${chainNote}`;
        vouchStatus.textContent = "Trustee vouch recorded for this period";
      } finally {
        vouchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
